server:
  port: 8088

spring:
  config:
    import: optional:nacos:gold-product-service.yaml?refresh=true
  application:
    name: gold-product-service

  datasource:
    url: jdbc:mysql://localhost:3306/goldsim?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 192.168.153.129
      port: 6379
      database: 0

  rabbitmq:
    host: 192.168.153.129
    port: 5672
    username: goldsim
    password: '123'
    virtual-host: /goldsim
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  cloud:
    nacos:
      discovery:
        server-addr: 192.168.153.129:8848
      config:
        server-addr: 192.168.153.129:8848
        file-extension: yaml

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    type-handlers-package: com.gold.common.mybatis.handler
  type-aliases-package: com.gold.product.entity

logging:
  level:
    com.gold: debug